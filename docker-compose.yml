version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cdb_backend
    restart: always
    network_mode: host
    environment:
      - PORT=5001
      - MONGO_URI=${MONGO_URI:-mongodb://127.0.0.1:27017/smt_portal}
      - JWT_SECRET=${JWT_SECRET:-cdb_portal_secret_key_2024}
      - FRONTEND_URL=${FRONTEND_URL:-http://srv1775038.hstgr.cloud}
    volumes:
      - backend_uploads:/app/uploads
      - backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: cdb_frontend
    restart: always
    network_mode: host

volumes:
  backend_uploads:
  backend_storage:
